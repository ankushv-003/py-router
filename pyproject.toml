[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.12.0",
    "setuptools-scm>=8.0",
    "pytest>=8.0.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "ch-router"
dynamic = ["version"]
description = "Fast map matching and contraction hierarchy routing for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "ankushv-003"},
]
keywords = ["map-matching", "gps", "trajectory", "routing", "GIS", "contraction-hierarchy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/ankushv-003/ch-router"
Documentation = "https://github.com/ankushv-003/ch-router"
Repository = "https://github.com/ankushv-003/ch-router"

[tool.scikit-build]
# Scikit-build-core configuration for CMake integration
build.verbose = false
build-dir = "build"  # Use persistent build directory for incremental builds
cmake.build-type = "Release"
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "python/fastmm/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.cibuildwheel]
# Build for Python 3.10-3.13
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-musllinux_* *-manylinux_i686"

# Build verbosity
build-verbosity = 1

# Install test dependencies into the test venv
test-requires = ["pytest>=8.0", "numpy>=1.20"]

# Run tests against the installed wheel
test-command = "python -m pytest {package}/test_fastmm.py {package}/tests/ -v"


[tool.cibuildwheel.linux]
# Use manylinux_2_28 (AlmaLinux 8) instead of manylinux2014 (CentOS 7 EOL)
before-build = "yum install -y boost-devel cmake"
# Repair wheel to bundle external dependencies, exclude libfastmmlib.so which is already in the wheel
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libfastmmlib.so"
# Use newer manylinux image
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
before-build = "brew install boost cmake libomp"
# MACOSX_DEPLOYMENT_TARGET is set by the CI workflow (a real-bash step that
# derives it from the runner via sw_vers), because cibuildwheel's environment
# evaluator cannot run a piped command. cibuildwheel inherits it from the
# ambient environment. OpenMP_ROOT is a simple substitution and stays here.
environment = { OpenMP_ROOT = "$(brew --prefix libomp)" }
# Same exclude strategy as Linux: libfastmmlib.dylib already lives next to
# fastmm.so inside the wheel (installed by CMake) and the extension's RPATH is
# @loader_path, so delocate must NOT copy it into .dylibs/ and rewrite paths.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --exclude libfastmmlib.dylib"

[tool.ruff]
line-length = 120
target-version = "py312"
